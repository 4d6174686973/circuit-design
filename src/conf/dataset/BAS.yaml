# @package _global_
# Bars-and-stripes dataset. Select with `dataset=BAS` on the CLI or in scripts/sweep.sh.
data:
  dataset: BAS
  width: 4                        # width of the BAS image
  height: 3                       # height of the BAS image
  N_qubits: 12                    # width * height
  bas_split_mode: holdout         # full_support (all patterns in every split) or holdout (seeded disjoint partition)
circuit:
  extension_metric: hamming       # hamming, varinfo
