# @package _global_
# Japanese Government Bond yields dataset. Select with `dataset=JGB` on the CLI or in scripts/sweep.sh.
data:
  dataset: JGB
  N_qubits: 16                    # number of qubits
  N_features: 4                   # number of features for JGB dataset, 3 or 4
circuit:
  extension_metric: varinfo       # hamming, varinfo
