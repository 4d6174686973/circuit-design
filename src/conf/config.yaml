defaults:
  - config_schema
  - dataset: JGB
  - _self_

### Data setup (dataset-independent) ###
data:
  train_split: 0.7                # pct of trainset samples between 0 and 1
  val_split: 0.15                 # pct of validation samples; test = 1 - train_split - val_split

### IBM setup ###
ibm:
  simulator: aer_statevec_cpu     # aer_statevec_cpu, aer_statevec_gpu, aer_kawasaki
  transpiler: service             # local or service (not used in statevector simulation)
  optimization_level: 3           # optimization for running the quantum circuit: 0, 1, 2, 3 (not used in statevector simulation)
  ai_transpiler: True             # True or False (not used in statevector simulation)

### Aer performance ###
aer:
  aer_max_parallel_experiments: 0       # 0 = auto (across bound circuits); >0 caps parallel experiments
  aer_max_parallel_shots: 0             # 0 = auto; setting 1 disables batched parameter execution (much slower)
  aer_batched_shots_gpu_max_qubits: 16  # GPU batched-shots cutoff (only for aer_statevec_gpu)
  aer_blocking_qubits_threshold: 28     # enable multi-GPU blocking at/above this qubit count
  aer_blocking_qubits: 24               # chunk size for multi-GPU blocking
  gradient_workers: 8                   # threads for the per-parameter gradient loop

### MPS setup ###
mps:
  cutoff: 5.0e-05                 # cutoff precision for the MPS
  descenting_step_length: 0.05    # step length for the descent
  descent_steps: 10               # number of steps for the descent
  train_loops: 10                 # number of loops for training

### Circuit setup ###
circuit:
  extension: metric_based         # none, all_to_all, nearest_neighbor, metric_based, random

### QCBM setup ###
qcbm:
  iterations: 10                  # number of training iterations
  mmd_batch_size: 1000            # 0 for using the full train set or positive integer for MMD mini-batch size
  N_shots: 1000                   # number of shots in sampling
  loss_func: MMD                  # MMD, KL (KL not working yet)
  sigmas: [1.0]                   # Bandwidth for MMD Kernel
  finite_diff_epsilon: 1.0e-8     # epsilon used in finite difference sampling for KL (does not work yet)
  adam_learning_rate: 0.01        # initial learning rate for ADAM
  eval_every: 1                   # compute full train/val/test MMD every k iterations (+ final)
  model_selection_metric: mmd_val # metric used to pick the best checkpoint (mmd_val recommended)

### Sweep / batching ###
# initial_random_seed is the ONLY seed you set. runs_batch_size auto-seeded runs are spawned per
# hydra job, each derived as initial_random_seed + i (i = 0 .. runs_batch_size-1) and logged as the
# run's effective seed -- there is no separate "random_seed" to set or accidentally collide on.
sweep:
  runs_batch_size: 1               # number of auto-seeded training runs per hydra job (seeds)
  initial_random_seed: 42          # base seed; run i in a batch uses initial_random_seed + i
  gpus_per_node: 0                 # >0 round-robins runs across GPUs via CUDA_VISIBLE_DEVICES; 0 = CPU mode
  # CPU parallelism budget shared across the WHOLE --multirun (all grid combos x seeds run at once,
  # not one combo at a time). Both 0 = auto: max_parallel_runs = min(total_runs, n_cpus),
  # threads_per_run = n_cpus // max_parallel_runs. See src/setup.py::plan_resources.
  max_parallel_runs: 0             # concurrent training runs across the whole sweep (0 = auto)
  threads_per_run: 0               # OMP/BLAS/Aer/gradient threads per run (0 = auto)

### Logging ###
logging:
  wandb_project: qcbm-circuit-design
  wandb_entity: null              # null = your default wandb entity
  wandb_mode: online              # online, offline, disabled
