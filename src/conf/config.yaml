defaults:
  - config_schema
  - dataset: JGB
  - _self_

### Data setup (dataset-independent) ###
data:
  train_split: 0.5                # pct of trainset samples between 0 and 1
  val_split: 0.25                 # pct of validation samples; test = 1 - train_split - val_split

### IBM setup ###
ibm:
  simulator: aer_statevec_cpu     # aer_statevec_cpu, aer_statevec_gpu, aer_kawasaki
  transpiler: service             # local or service (not used in statevector simulation)
  optimization_level: 3           # optimization for running the quantum circuit: 0, 1, 2, 3 (not used in statevector simulation)
  ai_transpiler: True             # True or False (not used in statevector simulation)

### Aer performance ###
aer:
  aer_max_parallel_experiments: 0       # 0 = auto (across bound circuits); >0 caps parallel experiments
  aer_max_parallel_shots: 0             # 0 = auto; setting 1 disables batched parameter execution (much slower)
  aer_batched_shots_gpu_max_qubits: 16  # GPU batched-shots cutoff (only for aer_statevec_gpu)
  aer_blocking_qubits_threshold: 28     # enable multi-GPU blocking at/above this qubit count
  aer_blocking_qubits: 24               # chunk size for multi-GPU blocking
  gradient_workers: 8                   # threads for the per-parameter gradient loop

### MPS setup ###
mps:
  cutoff: 5.0e-05                 # cutoff precision for the MPS
  descenting_step_length: 0.05    # step length for the descent
  descent_steps: 10               # number of steps for the descent
  train_loops: 10                 # number of loops for training

### Circuit setup ###
circuit:
  extension: metric_based         # none, all_to_all, nearest_neighbor, metric_based, chow_liu, random
  threshold_rule: percolation            # knee, percolation -- how metric_based auto-selects its threshold
  threshold: null                        # explicit metric_based threshold; overrides threshold_rule unless null

### QCBM setup ###
qcbm:
  mode: measurements                # iterations, measurements
  measurement_budget: 5e8         # 2e8; only used when mode=measurements
  iterations: 100                 # number of training iterations; only when mode=iterations
  mmd_batch_fraction: 0.0         # fraction of training samples used for each gradient update
  N_shots: 2000                   # number of shots in sampling
  loss_func: MMD                  # MMD, KL (KL not working yet)
  sigmas: [0.25, 1.0, 4.0, 16.0]  # Bandwidth for MMD Kernel
  finite_diff_epsilon: 1.0e-8     # epsilon used in finite difference sampling for KL (does not work yet)
  adam_learning_rate: 0.01        # initial learning rate for ADAM
  eval_every: 10                   # compute full train/val/test MMD every k iterations (+ final)
  model_selection_metric: mmd_val # metric used to pick the best checkpoint (mmd_val recommended)

### Sweep / batching ###
sweep:
  runs_batch_size: 16              # number of auto-seeded training runs per hydra job (seeds)
  initial_random_seed: 42          # base seed; run i in a batch uses initial_random_seed + i
  gpus_per_node: 0                 # >0 round-robins runs across GPUs via CUDA_VISIBLE_DEVICES; 0 = CPU mode
  max_parallel_runs: 0             # concurrent training runs (0 = auto ~= all cores)
  threads_per_run: 0               # OMP/BLAS/Aer/gradient threads per run (0 = auto)

### Logging ###
logging:
  wandb_project: qcbm-circuit-design
  wandb_entity: null              # null = your default wandb entity
  wandb_mode: online              # online, offline, disabled
  log_level: INFO                 # INFO (verbose, default) or WARNING (quiet -- real/production runs)

  # --- wandb request-rate control (src/wandb_logging.py) ---
  wandb_flush_every: 10           # buffered iteration rows per push (1 = push every iteration)
  wandb_flush_interval_s: 30.0   # also push if this long since the last push (slow-iteration runs)
  wandb_transmit_interval_s: 20.0 # filestream transmit interval
  wandb_log_artifacts: true       # per-run model artifact upload (benchmark.py loads checkpoints from it)

  # --- wandb robustness (a 429 must never kill a training run) ---
  wandb_init_stagger_s: 1.0       # init jitter window = this x sweep.max_parallel_runs seconds
  wandb_init_retries: 5           # extra wandb.init() attempts before training without wandb
  wandb_retry_max: 5              # retries for the wandb calls WE make (not wandb-core's internal
  wandb_retry_wait_max_s: 60.0    # HTTP retry budget -- shortening that drops run data mid-stream)
  wandb_max_failures: 5           # consecutive failed pushes before dropping wandb for that run
  wandb_init_timeout_s: 300.0     # wandb.init() timeout (the 90s default is tight at high fan-out)
  wandb_service_wait_s: 120.0     # wait for the local wandb-core service (default 30s)
